name: ballchaser

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Las claves de desarrollo (SECRET_ENCRYPTION_KEY, el token de Ballchasing...)
    # viven en backend/.env, que esta en .gitignore. Sin esto el contenedor arrancaria
    # sin cifrado y `PUT /me/ballchasing-token` responderia 503.
    # Lo de `environment` de abajo manda sobre lo que venga de aqui.
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      DATABASE_URL: postgresql+psycopg://ballchaser:ballchaser@db:5432/ballchaser
      # El frontend de desarrollo corre en 5173; el desplegado en GitHub Pages
      # tendra que anadirse aqui (y en Render) cuando exista.
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-service-account.json
    volumes:
      # Solo en local: la clave de servicio se monta, nunca se copia a la imagen.
      # En Render se usa FIREBASE_CREDENTIALS_JSON como variable de entorno.
      - ./backend/secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ballchaser
      POSTGRES_PASSWORD: ballchaser
      POSTGRES_DB: ballchaser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballchaser -d ballchaser"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: