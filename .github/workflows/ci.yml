name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Migraciones (SQL generado para Postgres)
        run: alembic upgrade head --sql

      # Se audita la lista de dependencias congelada y no el entorno entero:
      # `ballchaser-api` se instala en editable y no existe en PyPI, asi que
      # `pip-audit` lo trataria como vulnerabilidad.
      - name: Congelar dependencias
        run: pip list --format=freeze | grep -v -e "^-e " -e "^ballchaser" > requirements-ci.txt

      - name: Auditoria de dependencias
        run: pip-audit --strict -r requirements-ci.txt

  backend-postgres:
    name: Backend (tests contra Postgres real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ballchaser
          POSTGRES_PASSWORD: ballchaser
          POSTGRES_DB: ballchaser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ballchaser -d ballchaser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Los tests default usan SQLite; aqui se comprueba que tambien funcionan
      # contra Postgres, que es el motor real de produccion.
      - name: Tests contra Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ballchaser:ballchaser@localhost:5432/ballchaser_test
        run: pytest -v

      - name: Migraciones sobre Postgres
        env:
          DATABASE_URL: postgresql+psycopg://ballchaser:ballchaser@localhost:5432/ballchaser_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (tipos, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Las variables de Firebase no hacen falta para compilar ni para testear: son
      # valores publicos y aqui solo se verifica que el codigo esta bien.
      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Build imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ballchaser-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max