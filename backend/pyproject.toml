[project]
name = "ballchaser-api"
version = "0.1.0"
description = "API multiusuario que sincroniza replays de Rocket League desde Ballchasing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # El techo en 2.1 es intencionado: las extensiones C de SQLAlchemy 2.1 fallan
# ("InternalTraversal object is not callable") cuando hay un tracer activo, lo
# que rompe `pytest --cov` y falsea la cobertura.
"sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "firebase-admin>=6.5",
    "cryptography>=43",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ANN", "ASYNC"]
ignore = [
    "S101",    # assert: permitido en tests
    "ANN401",
    # Las excepciones del proyecto se nombran en castellano (ErrorDeCifrado,
    # TokenInvalido) y no con el sufijo `Error` que pide la regla.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "ANN201", "ANN001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
mypy_path = "backend"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy asincrono hace `await` dentro de greenlets; sin esta opcion coverage
# pierde el trazado al cambiar de contexto y subestima la cobertura.
concurrency = ["greenlet", "thread"]