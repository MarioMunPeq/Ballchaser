<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta
      name="description"
      content="Analizador de replays de Rocket League: tendencias de juego a partir de tus partidas de Ballchasing."
    />
    <title>BallChaser · tus replays</title>
    <!-- Fix SPA routing en GitHub Pages: https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.startsWith('/404.html')) {
          var newPath = path.replace('/404.html', '');
          var search = window.location.search;
          var hash = window.location.hash;
          if (newPath === '/' && search === '' && hash === '') {
            newPath = '/';
          }
          window.history.replaceState(null, '', newPath + search + hash);
        } else if (path.includes('/404.html')) {
          var newPath = path.replace('/404.html', '');
          window.history.replaceState(null, '', newPath + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
